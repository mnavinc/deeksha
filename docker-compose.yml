services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deeksha
      POSTGRES_USER: deeksha_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-production}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeksha_app -d deeksha"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://deeksha_app:${POSTGRES_PASSWORD:-change-me-before-production}@postgres:5432/deeksha
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-32-character-minimum-secret}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
