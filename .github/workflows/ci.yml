name: Enterprise CI Pipeline

on:
  push:
    branches: [main, master, 'release/**']
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-client-checks:
    name: Mobile & Web Client Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Client Dependencies
        run: npm ci

      - name: Run Static Code Analysis (ESLint)
        run: npm run lint

      - name: Verify TypeScript Types
        run: npm run typecheck

      - name: Execute Automated Unit & Integration Tests
        run: npm run test

  backend-api-checks:
    name: Backend API Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm ci --prefix backend

      - name: Typecheck Backend (tsc)
        run: npm run typecheck --prefix backend

      - name: Build Production Bundle (tsc)
        run: npm run build --prefix backend

      - name: Execute Backend Test Suite
        run: npm run test --prefix backend

  container-build-verification:
    name: Container Build & Health Probe
    needs: [backend-api-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: deeksha-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
